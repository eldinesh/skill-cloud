name: validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: bash tools/validate.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build per-skill zips (for claude.ai upload)
        run: |
          mkdir -p dist
          for d in skills/*/*/; do
            name=$(basename "$d")
            (cd "$(dirname "$d")" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
          ls -la dist/
      - name: Extract latest changelog section
        run: awk '/^## /{n++} n==1' CHANGELOG.md > /tmp/notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" dist/*.zip --notes-file /tmp/notes.md --title "SkillCloud $GITHUB_REF_NAME"
